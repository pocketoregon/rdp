name: LINUX RDP

on:
  workflow_dispatch:
    inputs:
      rclone_token:
        type: string
        description: 'Google Drive rclone token (optional - for file sync)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 9999

    steps:
      - name: 🔧 Install Desktop & RDP
        run: |
          echo "⏳ Updating packages..."
          sudo apt-get update -q
          echo "✅ Done"

          echo "⏳ Installing lightweight desktop + RDP..."
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            lxde-core \
            xrdp \
            dbus-x11
          echo "✅ Desktop installed"

      - name: 👤 Setup User & RDP Access
        run: |
          echo "runner:OLDUSER#06" | sudo chpasswd
          echo "startlxde" > /home/runner/.xsession
          chmod +x /home/runner/.xsession
          sudo systemctl enable xrdp
          sudo systemctl start xrdp
          sleep 3
          echo "✅ RDP ready"

      - name: 📦 Setup Rclone & Google Drive Sync
        run: |
          TOKEN="${{ github.event.inputs.rclone_token }}"
          if [ -z "$TOKEN" ]; then
            echo "⚠️ No rclone token — skipping"
            exit 0
          fi
          curl https://rclone.org/install.sh | sudo bash
          mkdir -p ~/.config/rclone
          printf "[gdrive]\ntype = drive\ntoken = %s\n" "$TOKEN" > ~/.config/rclone/rclone.conf
          mkdir -p ~/Workspace
          rclone copy gdrive:RDP-Workspace ~/Workspace --progress || true
          (while true; do sleep 300; rclone copy ~/Workspace gdrive:RDP-Workspace --quiet; done) &
          echo "✅ Auto-sync started"

      - name: 🚀 Start Cloudflare Tunnel & Get URL
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -O cloudflared
          chmod +x cloudflared
          ./cloudflared tunnel --url tcp://localhost:3389 --logfile /tmp/cloudflared.log &
          sleep 15
          URL=""
          for i in $(seq 1 10); do
            echo "🔍 Attempt $i..."
            URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' /tmp/cloudflared.log | head -1)
            if [ -n "$URL" ]; then break; fi
            sleep 3
          done
          if [ -z "$URL" ]; then echo "❌ No tunnel URL"; exit 1; fi
          echo "✅ Tunnel: $URL"
          echo "$URL" > /tmp/tunnel_url.txt

      - name: 🔁 Keep Runner Alive
        run: |
          URL=$(cat /tmp/tunnel_url.txt)
          echo "============================================"
          echo "✅ LINUX RDP IS READY!"
          echo "Tunnel URL : $URL"
          echo "Username   : runner"
          echo "Password   : OLDUSER#06"
          echo "Connect    : cloudflared access tcp --hostname ${URL#https://} --url localhost:3390"
          echo "Then RDP to: localhost:3390"
          echo "============================================"
          sleep 21600
          
