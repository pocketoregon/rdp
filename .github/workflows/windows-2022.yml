name: WINDOWS TOKEN RDP

on:
  workflow_dispatch:
    inputs:
      rclone_token:
        type: string
        description: 'Google Drive rclone token (optional - for file sync)'
        required: false
        default: ''

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 9999

    steps:
      - name: 🔽 Download Files
        shell: pwsh
        run: |
          Invoke-WebRequest https://raw.githubusercontent.com/Riders004/rdp/master/start.bat -OutFile start.bat
          Invoke-WebRequest https://raw.githubusercontent.com/Riders004/rdp/master/wallpaper.bat -OutFile wallpaper.bat
          Invoke-WebRequest https://raw.githubusercontent.com/Vip3rLi0n/Ngrok-RDPs/main/resources/loop.ps1 -OutFile loop.ps1
          Invoke-WebRequest https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe -OutFile cloudflared.exe

      - name: 🔧 Enable RDP & Configure Firewall
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
          Copy-Item wallpaper.bat D:\a\wallpaper.bat

      - name: 🎨 Install Mesa Software OpenGL (for Blender GUI)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/pal1000/mesa-dist-win/releases/download/23.3.1/mesa3d-23.3.1-release-mingw.7z -OutFile mesa.7z
          7z x mesa.7z -omesa
          $blenderPath = "C:\Program Files\Blender Foundation"
          if (Test-Path $blenderPath) {
            $blenderExe = Get-ChildItem $blenderPath -Recurse -Filter "blender.exe" | Select-Object -First 1
            if ($blenderExe) {
              Copy-Item mesa\x64\opengl32.dll $blenderExe.DirectoryName -Force
              Write-Host "✅ Mesa OpenGL copied to Blender folder"
            }
          }
          [System.Environment]::SetEnvironmentVariable("MESA_GL_VERSION_OVERRIDE", "4.5", "Machine")
          [System.Environment]::SetEnvironmentVariable("LIBGL_ALWAYS_SOFTWARE", "1", "Machine")
          Write-Host "✅ Mesa environment variables set"

      - name: 📦 Setup Rclone & Google Drive Sync
        shell: pwsh
        run: |
          $token = '${{ github.event.inputs.rclone_token }}'

          if (-not $token) {
            Write-Host "⚠️ No rclone token provided — skipping Google Drive sync"
            exit 0
          }

          # Install rclone
          Invoke-WebRequest https://downloads.rclone.org/rclone-current-windows-amd64.zip -OutFile rclone.zip
          Expand-Archive rclone.zip -DestinationPath rclone_tmp
          $rcloneExe = Get-ChildItem rclone_tmp -Recurse -Filter "rclone.exe" | Select-Object -First 1
          Copy-Item $rcloneExe.FullName "C:\rclone.exe"
          Write-Host "✅ Rclone installed"

          # Write rclone config
          $configDir = "$env:APPDATA\rclone"
          New-Item -ItemType Directory -Force -Path $configDir | Out-Null
          $config = @"
          [gdrive]
          type = drive
          token = $token
          "@
          $config | Out-File -FilePath "$configDir\rclone.conf" -Encoding utf8
          Write-Host "✅ Rclone config written"

          # Create workspace folder
          New-Item -ItemType Directory -Force -Path C:\Workspace | Out-Null

          # Restore from Google Drive
          Write-Host "🔄 Restoring files from Google Drive..."
          & C:\rclone.exe copy gdrive:RDP-Workspace C:\Workspace --progress 2>&1
          Write-Host "✅ Restore complete"

          # Desktop shortcut for manual sync
          $syncScript = @'
          Write-Host "Syncing to Google Drive..."
          & C:\rclone.exe copy C:\Workspace gdrive:RDP-Workspace --progress
          Write-Host "Done! Press any key..."
          pause
          '@
          $syncScript | Out-File -FilePath "C:\SyncNow.ps1" -Encoding utf8

          $desktop = [System.Environment]::GetFolderPath("CommonDesktopDirectory")
          $WshShell = New-Object -ComObject WScript.Shell
          $Shortcut = $WshShell.CreateShortcut("$desktop\Sync to Google Drive.lnk")
          $Shortcut.TargetPath = "powershell.exe"
          $Shortcut.Arguments = "-ExecutionPolicy Bypass -File C:\SyncNow.ps1"
          $Shortcut.IconLocation = "shell32.dll,46"
          $Shortcut.Save()
          Write-Host "✅ Desktop shortcut created"

          # Auto-sync every 5 minutes in background
          $autoSync = @'
          while ($true) {
            Start-Sleep -Seconds 300
            & C:\rclone.exe copy C:\Workspace gdrive:RDP-Workspace --quiet 2>&1 | Out-Null
            Write-Host "[$(Get-Date -Format 'HH:mm:ss')] Auto-synced to Google Drive"
          }
          '@
          $autoSync | Out-File -FilePath "C:\AutoSync.ps1" -Encoding utf8
          Start-Process -WindowStyle Hidden powershell -ArgumentList "-ExecutionPolicy Bypass -File C:\AutoSync.ps1"
          Write-Host "✅ Auto-sync started (every 5 minutes)"

      - name: 🚀 Start Cloudflare Tunnel & Get URL
        shell: pwsh
        run: |
          $logFile = "$env:TEMP\cloudflared.log"
          Start-Process -FilePath ".\cloudflared.exe" -ArgumentList "tunnel --url tcp://localhost:3389 --logfile $logFile" -WindowStyle Hidden
          Write-Host "Waiting for tunnel to initialize..."
          Start-Sleep -Seconds 15

          $url = $null
          for ($i = 0; $i -lt 10; $i++) {
            if (Test-Path $logFile) {
              $content = Get-Content $logFile -Raw
              if ($content -match 'https://[a-z0-9\-]+\.trycloudflare\.com') {
                $url = $matches[0]
                break
              }
            }
            Start-Sleep -Seconds 3
          }

          if (Test-Path $logFile) {
            Write-Host "=== Cloudflared Log ==="
            Get-Content $logFile | Select-Object -Last 20
          }

          if (-not $url) {
            Write-Host "❌ Could not get Cloudflare tunnel URL"
            exit 1
          }

          Write-Host "✅ Cloudflare Tunnel URL: $url"
          $url | Out-File -FilePath "$env:TEMP\tunnel_url.txt"

      - name: ⚙️ Run Setup Script (start.bat) with tunnel URL + credentials
        shell: pwsh
        run: |
          $url = Get-Content "$env:TEMP\tunnel_url.txt"
          Write-Host "Using URL: $url"

          $escapedUrl = $url.Replace('"', '\"')
          $escapedUser = 'administrator'.Replace('"','\"')
          $escapedPass = 'OLDUSER#06'.Replace('"','\"')

          $cmd = "start.bat `"$escapedUrl`" `"$escapedUser`" `"$escapedPass`""
          cmd.exe /c $cmd

      - name: 🔁 Keep Runner Alive
        shell: pwsh
        run: pwsh -ExecutionPolicy Bypass -File .\loop.ps1
