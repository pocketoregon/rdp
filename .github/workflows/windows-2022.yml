name: WINDOWS TOKEN RDP

on:
  workflow_dispatch:
    inputs:
      increment:
        type: string
        description: 'ngrok token'
        required: false
        default: ''

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 9999

    steps:
      - name: 🔽 Download Files
        run: |
          Invoke-WebRequest https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip -OutFile ngrok.zip
          Invoke-WebRequest https://raw.githubusercontent.com/Riders004/rdp/master/start.bat -OutFile start.bat
          Invoke-WebRequest https://raw.githubusercontent.com/Riders004/rdp/master/wallpaper.bat -OutFile wallpaper.bat
          Invoke-WebRequest https://raw.githubusercontent.com/Vip3rLi0n/Ngrok-RDPs/main/resources/loop.ps1 -OutFile loop.ps1

      - name: 📦 Extract Ngrok
        run: Expand-Archive ngrok.zip

      - name: 🔐 Set Ngrok Authtoken
        shell: pwsh
        run: |
          $inputToken = '${{ github.event.inputs.increment }}'
          $envToken = $Env:NGROK_AUTH
          $defaultToken = '316WRV55lXVjwT4mXHuMYskqxiu_4bMAdBptaGPiZMBiZz82s'
          if ($inputToken) {
            $token = $inputToken
          } elseif ($envToken) {
            $token = $envToken
          } else {
            $token = $defaultToken
          }
          Write-Host "Using ngrok token: $($token.Substring(0,[Math]::Min(30,$token.Length)))***"
          .\ngrok\ngrok.exe config add-authtoken $token
        env:
          NGROK_AUTH: ${{ secrets.TAKEN }}

      - name: 🔧 Enable RDP & Configure Firewall
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
          Copy-Item wallpaper.bat D:\a\wallpaper.bat

      - name: 🚀 Start Ngrok Tunnel & Get URL
        shell: pwsh
        run: |
          # Start ngrok and capture output to log file
          $logFile = "$env:TEMP\ngrok.log"
          Start-Process -FilePath ".\ngrok\ngrok.exe" -ArgumentList "tcp --region ap 3389 --log $logFile --log-format json" -WindowStyle Hidden
          Start-Sleep -Seconds 15

          # Try to get URL from API
          $url = $null
          for ($i = 0; $i -lt 10; $i++) {
            try {
              $tunnels = Invoke-RestMethod -Uri 'http://localhost:4040/api/tunnels' -ErrorAction Stop
              if ($tunnels.tunnels.Count -gt 0) {
                $url = $tunnels.tunnels[0].public_url
                break
              }
            } catch {}
            Start-Sleep -Seconds 3
          }

          # Show log for debugging
          if (Test-Path $logFile) {
            Write-Host "=== Ngrok Log ==="
            Get-Content $logFile | Select-Object -Last 20
          }

          if (-not $url) {
            Write-Host "❌ Could not get Ngrok URL"
            exit 1
          }

          Write-Host "✅ Ngrok URL: $url"
          $url | Out-File -FilePath "$env:TEMP\ngrok_url.txt"

      - name: ⚙️ Run Setup Script (start.bat) with NGROK URL + credentials
        shell: pwsh
        run: |
          $url = Get-Content "$env:TEMP\ngrok_url.txt"
          Write-Host "Using URL: $url"

          $escapedUrl = $url.Replace('"', '\"')
          $escapedUser = 'administrator'.Replace('"','\"')
          $escapedPass = 'OLDUSER#06'.Replace('"','\"')

          $cmd = "start.bat `"$escapedUrl`" `"$escapedUser`" `"$escapedPass`""
          cmd.exe /c $cmd

      - name: 🔁 Keep Runner Alive
        shell: pwsh
        run: pwsh -ExecutionPolicy Bypass -File .\loop.ps1
